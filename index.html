<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6d951d" />
  <meta name="description" content="Zaman Fitness — workouts built around your goal and the equipment you own, with a tutorial video on every exercise." />
  <title>Zaman Fitness — workouts built around you</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Zaman" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2" />

  <script>
    // Runs before every other script so it also catches parse errors in them.
    // Without this, a failure anywhere leaves a blank page with nothing to go on.
    (function () {
      function show(title, detail) {
        var box = document.getElementById('boot-error');
        if (!box) {
          box = document.createElement('div');
          box.id = 'boot-error';
          box.setAttribute('style', 'position:fixed;inset:12px;z-index:9999;overflow:auto;background:#fff;' +
            'border:2px solid #c0432c;border-radius:16px;padding:16px;color:#20251d;' +
            'font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;box-shadow:0 18px 50px rgba(0,0,0,.25)');
          (document.body || document.documentElement).appendChild(box);
        }
        box.innerHTML = '<b style="font:700 15px system-ui;color:#c0432c">Zaman Fitness failed to start</b>' +
          '<p style="font:13px system-ui;color:#6b7065">Screenshot this and send it over.</p>' +
          '<div style="background:#faf6f5;border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-word">' +
          '<b>' + title + '</b>\n' + detail + '</div>' +
          '<p style="font:12px system-ui;color:#8b9085">' + location.href + '</p>';
      }
      window.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT') { show('Script did not load', String(e.target.src || '(inline)')); return; }
        if (e.target && e.target.tagName === 'LINK') return;          // stylesheet/font: not fatal
        show(e.message || 'Script error', (e.filename || '') + ':' + (e.lineno || 0));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('Unhandled promise rejection', (r && (r.stack || r.message)) || String(r));
      });
      window.addEventListener('load', function () {
        setTimeout(function () {
          var app = document.getElementById('app');
          if (app && !app.innerHTML.trim() && !document.getElementById('boot-error')) {
            show('Nothing rendered', 'Scripts loaded but no screen was drawn.');
          }
        }, 8000);
      });
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="loading"><div class="spinner"></div><p class="sub">Loading Zaman Fitness…</p></div>
  </div>
  <noscript>
    <p style="font:15px system-ui;padding:24px;text-align:center">Zaman Fitness needs JavaScript enabled.</p>
  </noscript>

  <script src="firebase-config.js?v=2"></script>
  <script src="data.js?v=2"></script>
  <script src="backend.js?v=2"></script>
  <script src="store.js?v=2"></script>
  <script src="admin.js?v=2"></script>
  <script src="app.js?v=2"></script>
  <script>
    // Offline support. Registered after load so it never delays first paint.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('[Zaman Fitness] Service worker not registered:', err && err.message);
        });
      });
    }
  </script>
</body>
</html>
